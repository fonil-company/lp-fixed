    <!--
      Meta Pixel no HTML: o PageView dispara antes de baixar o app (melhora o connect rate).
      O eventID fica em window.__fixedPageViewId para a API de Conversões deduplicar (src/lib/pixel.ts).
      Se trocar o ID aqui, troque também em src/config/env.ts.
    -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      window.__fixedPageViewId = 'PageView.' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
      fbq('init', '4367782926817920');
      fbq('track', 'PageView', {}, { eventID: window.__fixedPageViewId });
    </script>

    <!-- Rastreamento do CRM (Umbrella Ecosystem). -->
